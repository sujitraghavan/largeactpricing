<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step 3: Loss Run — Commercial Auto Loss Rating</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.0"></script>
  <style>
    .btn-primary { background: #2563eb; color: white; padding: 0.75rem 1.5rem; border-radius: 0.5rem; border: none; font-weight: 600; cursor: pointer; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #e5e7eb; color: #374151; padding: 0.75rem 1.5rem; border-radius: 0.5rem; border: none; font-weight: 500; cursor: pointer; }
    .btn-secondary:hover { background: #d1d5db; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <nav class="bg-white shadow-sm border-b border-gray-200 px-6 py-4">
    <h1 class="text-xl font-bold text-gray-800">Commercial Auto Loss Rating</h1>
    <div class="text-sm text-gray-600 hidden md:block">Step 3 of 4 · Loss Run</div>
  </nav>

  <div class="max-w-2xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
    <h2 class="text-2xl font-bold text-gray-900 mb-2">Occurrence Loss Run</h2>
    <p class="text-sm text-gray-500 mb-6">Enter one ground-up occurrence per row including zero-dollar claims. Upload CSV/Excel or use template below.</p>

    <!-- Upload area -->
    <form hx-post="/api/v1/loss-run/upload" hx-target="#upload-result" hx-swap="innerHTML" class="bg-white p-6 rounded-xl shadow border border-gray-200 mb-6">
      <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center mb-4">
        <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88 7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
        <p class="mt-2 text-gray-600">Drag & drop or <a href="#" class="text-blue-600 hover:underline" id="file-trigger">browse files</a></p>
        <p class="text-xs text-gray-400 mt-1">CSV or Excel (.xlsx) — Max 10MB</p>
        <input type="file" name="file" id="file-input" accept=".csv,.xlsx" class="hidden" hx-on:change="document.getElementById('file-name').textContent = this.files[0]?.name || ''">
      </div>

      <div id="file-name" class="text-sm text-gray-500 mb-4"></div>

      <div class="flex gap-4">
        <input type="hidden" name="account_id" value="temp-account">
        <button type="submit" class="btn-primary" disabled id="upload-btn">Upload & Parse</button>
        <a href="/api/v1/loss-run/template" download="loss_run_template.xlsx" class="btn-secondary">Download Template</a>
      </div>
    </form>

    <div id="upload-result" class="bg-white p-4 rounded-lg shadow border border-gray-200 hidden"></div>

    <!-- Next step button (enabled after upload) -->
    <div class="flex justify-between items-center pt-6">
      <button class="btn-secondary" onclick="history.back()">← Back</button>
      <form hx-get="/step/4" hx-target="#app" hx-swap="innerHTML" class="flex">
        <button type="submit" class="btn-primary" id="next-btn" disabled>Next: Review & Rate →</button>
      </form>
    </div>

  </div>

  <script>
    const fileInput = document.getElementById('file-input');
    const fileTrigger = document.getElementById('file-trigger');
    const uploadBtn = document.getElementById('upload-btn');
    const nextBtn = document.getElementById('next-btn');

    fileTrigger.addEventListener('click', e => { e.preventDefault(); fileInput.click(); });
    fileInput.addEventListener('change', () => {
      const name = fileInput.files[0]?.name;
      document.getElementById('file-name').textContent = name || '';
      uploadBtn.disabled = !name;
    });
  </script>
</body>
</html>
