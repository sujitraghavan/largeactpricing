<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step 2: Fleet Exposures — Commercial Auto Loss Rating</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.0"></script>
  <style>
    .btn-primary { background: #2563eb; color: white; padding: 0.75rem 1.5rem; border-radius: 0.5rem; border: none; font-weight: 600; cursor: pointer; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #e5e7eb; color: #374151; padding: 0.75rem 1.5rem; border-radius: 0.5rem; border: none; font-weight: 500; cursor: pointer; }
    .btn-secondary:hover { background: #d1d5db; }
    .btn-danger { background: #ef4444; color: white; padding: 0.25rem 0.75rem; border-radius: 0.375rem; border: none; font-weight: 500; cursor: pointer; font-size: 0.875rem; }
    .btn-danger:hover { background: #dc2626; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <nav class="bg-white shadow-sm border-b border-gray-200 px-6 py-4">
    <h1 class="text-xl font-bold text-gray-800">Commercial Auto Loss Rating</h1>
    <div class="text-sm text-gray-600 hidden md:block">Step 2 of 4 · Fleet Exposures</div>
  </nav>

  <div class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
    <h2 class="text-2xl font-bold text-gray-900 mb-2">Fleet Exposure Schedule</h2>
    <p class="text-sm text-gray-500 mb-6">Enter earned power-unit years for historical terms and expected units for the quote period. Trailer counts are descriptive.</p>

    <div class="bg-white rounded-xl shadow border border-gray-200 overflow-hidden mb-6">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 text-gray-600 font-medium">
          <tr>
            <th class="px-3 py-3 text-left">State</th>
            <th class="px-3 py-3 text-left">Vehicle Class</th>
            <th class="px-3 py-3 text-left">Radius</th>
            <th class="px-3 py-3 text-right">2022</th>
            <th class="px-3 py-3 text-right">2023</th>
            <th class="px-3 py-3 text-right">2024</th>
            <th class="px-3 py-3 text-right">2025</th>
            <th class="px-3 py-3 text-right">Proj. Units</th>
            <th class="px-3 py-3 text-right">Proj. Trailers</th>
            <th class="px-3 py-3 text-center">Action</th>
          </tr>
        </thead>
        <tbody id="fleet-rows" class="divide-y divide-gray-100">
          <!-- Row template -->
          <tr class="fleet-row">
            <td class="px-3 py-2">
              <select name="fleet.state" class="border rounded p-1.5 w-20 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                <option value="OH">OH</option><option value="PA">PA</option><option value="IN">IN</option>
              </select>
            </td>
            <td class="px-3 py-2">
              <select name="fleet.vehicle_class" class="border rounded p-1.5 w-32 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                <option value="Heavy truck">Heavy truck</option>
                <option value="Tractor">Tractor</option>
                <option value="Medium truck">Medium truck</option>
              </select>
            </td>
            <td class="px-3 py-2">
              <select name="fleet.operating_radius" class="border rounded p-1.5 w-28 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                <option value="Local">Local</option>
                <option value="Regional">Regional</option>
                <option value="Long haul">Long haul</option>
              </select>
            </td>
            <td class="px-3 py-2"><input type="number" name="fleet.units_2022" class="border rounded p-1.5 w-20 text-sm text-right focus:ring-2 focus:ring-blue-500 outline-none" min="0" value="0"></td>
            <td class="px-3 py-2"><input type="number" name="fleet.units_2023" class="border rounded p-1.5 w-20 text-sm text-right focus:ring-2 focus:ring-blue-500 outline-none" min="0" value="0"></td>
            <td class="px-3 py-2"><input type="number" name="fleet.units_2024" class="border rounded p-1.5 w-20 text-sm text-right focus:ring-2 focus:ring-blue-500 outline-none" min="0" value="0"></td>
            <td class="px-3 py-2"><input type="number" name="fleet.units_2025" class="border rounded p-1.5 w-20 text-sm text-right focus:ring-2 focus:ring-blue-500 outline-none" min="0" value="0"></td>
            <td class="px-3 py-2"><input type="number" name="fleet.projected_units" class="border rounded p-1.5 w-20 text-sm text-right focus:ring-2 focus:ring-blue-500 outline-none" min="0" value="0"></td>
            <td class="px-3 py-2"><input type="number" name="fleet.projected_trailers" class="border rounded p-1.5 w-24 text-sm text-right focus:ring-2 focus:ring-blue-500 outline-none" min="0" value="0"></td>
            <td class="px-3 py-2 text-center"><button class="btn-danger" onclick="this.closest('tr').remove()">Remove</button></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="flex gap-4 mb-6">
      <button class="btn-secondary" onclick="addFleetRow()">+ Add Row</button>
    </div>

    <form hx-get="/step/3" hx-target="#app" hx-swap="innerHTML" class="bg-white p-6 rounded-xl shadow border border-gray-200 space-y-4">
      <!-- Hidden account inputs are carried via JS or user re-edits -->
      <div class="flex justify-between items-center pt-4">
        <button type="button" class="btn-secondary" onclick="history.back()">← Back</button>
        <button type="submit" class="btn-primary">Next: Loss Run →</button>
      </div>
    </form>
  </div>

  <script>
    function addFleetRow() {
      const tbody = document.getElementById('fleet-rows');
      const template = tbody.querySelector('.fleet-row').cloneNode(true);
      template.querySelectorAll('input').forEach(inp => inp.value = '0');
      tbody.appendChild(template);
    }
  </script>
</body>
</html>
